[package]
name = "holdout-safe"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic, group-aware JSONL folds with reproducible audit manifests"
license = "MIT"
repository = "https://github.com/nicholas-ruest/holdout-safe"
readme = "README.md"
keywords = ["dataset", "holdout", "jsonl", "machine-learning", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = "thin"
strip = "symbols"
